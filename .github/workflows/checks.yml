name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Strukturelle Konsistenz (Slugs, Term-IDs, Quellen-Zuordnung)
      - run: npm run check:consistency
      - run: npm run lint
      - run: npm run test
      - run: npm run build
