name: Quellen-Check

# Externe Quellen-/Zitatpruefung. Getrennt vom schnellen Offline-Gate (checks.yml),
# weil sie externe Server kontaktiert (Link-Rot, Zitat-Abgleich). Woechentlich +
# manuell ausloesbar.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:sources
