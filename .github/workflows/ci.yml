name: Qualität

on:
  pull_request:
  push:
    branches:
      - design-redesign
      - stufe-1-mechanik

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:single
      - run: npm run emit:status
      - run: npm run emit:scope
      - name: Generierten Status auf Drift prüfen
        run: git diff --exit-code -- AP1_STATUS.md SCOPE_STATUS.md
